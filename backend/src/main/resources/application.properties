spring.application.name=edu
spring.security.user.name=admin
spring.security.user.roles=ADMIN

# 개인 DB 계정은 src/main/resources/application-local.properties에 적는다 (git에 안 올라감)
spring.config.import=optional:classpath:application-local.properties

# DB (로컬 MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/edu_shortform?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA: 테이블은 docs/sql 스크립트로 만든다. 서버는 테이블을 바꾸지 않고 Entity와 맞는지만 검사한다
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# 영상 업로드: 서버 실행 폴더의 uploads에 저장한다.
storage.location=${VIDEO_STORAGE_LOCATION:uploads}
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=101MB
